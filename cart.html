<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Store | CyberSec Summit 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container d-flex flex-wrap gap-2">
            <a class="navbar-brand" href="index.html">CyberSec Summit 2026</a>
            <div class="d-flex gap-3">
                <a class="nav-link text-white" href="index.html">Home</a>
                <a class="nav-link text-white" href="signup.html">Register</a>
                <a class="nav-link text-white" href="sessions.html">Sessions</a>
                <a class="nav-link text-white" href="cart.html" aria-current="page">Store</a>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <header class="text-center mb-4">
            <h1>Conference Store</h1>
            <p class="text-secondary">Browse conference sessions and event materials.</p>
        </header>
        <div class="row g-4">
            <section class="col-lg-8" aria-label="Products">
                <label class="form-label" for="productSearch">Search products</label>
                <input class="form-control mb-3" type="search" id="productSearch" placeholder="Search by name, ID or category">
                <div id="productList" class="row g-3"><!-- TODO: Render product cards with jQuery --></div>
            </section>
            <aside class="col-lg-4" aria-label="Shopping cart">
                <div class="card"><div class="card-body">
                    <h2 class="h4">Shopping Cart</h2>
                    <div id="cartItems"><!-- TODO: Cart items and Remove buttons --></div>
                    <p class="fw-bold">Total: <span id="cartTotal">$0.00</span></p>
                    <button id="sendCartButton" type="button" class="btn btn-primary">Prepare API Request</button>
                    <div id="cartStatus" role="status" aria-live="polite" class="mt-2"></div>
                </div></div>
            </aside>
        </div>
        <section class="card mt-4"><div class="card-body">
            <h2 class="h4">JSON Preview</h2>
            <pre id="cartJsonPreview">[]</pre>
            <!-- TODO: Optional product add/update form with JavaScript validation.
                 Existing sessions.html already has product form and validation. -->
        </div></section>
    </main>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
